function uid(prefix,arr){let n=1;while(arr.some(x=>x.id===prefix+n))n++;return prefix+n}
function navigate(v){view=v;selection=null;nextAction=null;render();window.scrollTo(0,0)}
function render(){document.getElementById('nav').innerHTML=navs.map(([id,t])=>`<button class="${view===id?'active':''}" onclick="navigate('${id}')" ${view===id?'aria-current="page"':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">${icons[id]}</svg>${t}</button>`).join('');document.getElementById('app').innerHTML=renderTaskGuide()+renderNextAction()+({home:renderHome,reader:renderReader,compare:renderCompare,map:renderMap,review:renderReview,walkthrough:renderWalkthrough,guide:renderGuide}[view])();}

function renderHome(){const pending=state.cards.filter(c=>!c.verified).length;return `<div class="hero"><div><div class="eyebrow">FROM READING TO REASONING</div><h1>把读到的内容，<br>变成有据可查的判断。</h1><p class="sub">${esc(state.rq)}</p><button class="primary" onclick="navigate('reader')">继续阅读与核对 →</button></div><div class="hero-art"><svg style="position:absolute;width:100%;height:100%" viewBox="0 0 300 180"><path d="M55 35L150 90L255 40M150 90L70 155M150 90L250 150" fill="none" stroke="#9db58e"/></svg><div class="art-center">evidence<br><small>↔ claim</small></div><div class="art-card" style="top:10px;left:0">原文 · Source</div><div class="art-card" style="top:20px;right:0">证据 · Evidence</div><div class="art-card" style="bottom:5px;left:10px">核对 · Verify</div><div class="art-card" style="bottom:8px;right:0">论点 · Claim</div></div></div><div class="stats">${[[state.papers.length,'研究材料','篇文稿'],[state.cards.length,'证据卡片','条摘录'],[state.claims.length,'正在形成的论点','个论点'],[pending,'等待你核对','条证据']].map(([n,t,u])=>`<div class="panel stat"><div class="sub">${t}</div><div class="number">${n}<span style="font:11px sans-serif;color:var(--muted);margin-left:8px">${u}</span></div></div>`).join('')}</div><div class="two-col"><section class="panel"><div class="panel-head"><h2>一条可以回溯的研究路径</h2></div><div class="steps">${[['阅读与摘录','点击文稿段落，保留原文与位置。','reader'],['比较与理解','并列查看样本、情境、方法与测量。','compare'],['连接与解释','说明证据如何支持或质疑论点。','map'],['检查与修正','处理待核对信息，重新考虑论点范围。','review']].map(([t,s,v],i)=>`<div class="step"><span class="step-num">0${i+1}</span><div><button class="text-link" onclick="navigate('${v}')">${t}</button><p>${s}</p></div></div>`).join('')}</div></section><section class="panel"><div class="panel-head"><h2>研究材料</h2><button class="small" onclick="importText()">＋ 导入文字</button></div><div class="paper-list">${state.papers.map(p=>`<div class="paper-row"><span class="paper-icon">${esc(p.id)}</span><div><h3>${esc(p.short)}</h3><div class="sub">${esc(p.author)} · ${p.pages.length} 页演示片段</div></div><button class="small" onclick="openPaper('${p.id}')">阅读</button></div>`).join('')}</div><div class="detail-body"><p class="sub">当前是文字文稿原型。真实 PDF 渲染与选区坐标定位属于正式开发阶段。</p><button class="small" onclick="editRQ()">修改研究问题</button></div></section></div>`}
function renderReader(){const p=paper(paperId)||state.papers[0];paperId=p.id;page=Math.min(page,p.pages.length-1);const pg=p.pages[page];let cards=state.cards.filter(c=>(filter==='all'||(filter==='verified'?c.verified:!c.verified))&&(!search||[c.quote,c.interpretation,c.id,paper(c.paper)?.short].join(' ').toLowerCase().includes(search.toLowerCase())));return heading('READ · CAPTURE · VERIFY','阅读与摘录','保留原文，写下理解。每一次判断，都有出处。',`<button class="primary create-evidence" onclick="newEvidence()" ${selection?'':'disabled'}>＋ 建立证据卡片</button>`)+`<div class="reader-grid"><section class="panel"><div class="paper-tools"><select aria-label="选择研究材料" onchange="changePaper(this.value)">${state.papers.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.id+' · '+x.short)}</option>`).join('')}</select><div class="pages"><button class="small" onclick="changePage(-1)" ${page===0?'disabled':''} aria-label="上一页">‹</button><span>${page+1} / ${p.pages.length}</span><button class="small" onclick="changePage(1)" ${page===p.pages.length-1?'disabled':''} aria-label="下一页">›</button></div></div><div class="document-wrap"><article class="document"><div class="journal">EVIDENCEBRIDGE · ${p.imported?'USER-IMPORTED TEXT':'FICTIONAL DEMONSTRATION MATERIAL'}</div><h2 class="doc-title">${esc(p.title)}</h2><div class="authors">${esc(p.author)} · ${esc(p.year)}</div><div class="doc-section">${esc(pg.section)}</div>${pg.paragraphs.map((x,i)=>`<p tabindex="0" role="button" aria-label="选择第${i+1}段" class="paragraph ${selection?.id===x.id?'selected':state.cards.some(c=>c.paragraph===x.id)?'linked':''}" onclick="selectParagraph('${x.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selectParagraph('${x.id}')}" data-paragraph="${x.id}"><span class="p-label">${state.cards.some(c=>c.paragraph===x.id)?'● 已有摘录':'点击选取段落'} · §${i+1}</span>${esc(x.text)}</p>`).join('')}<div class="doc-foot">${p.imported?'Imported text excerpt':'Fictional sample · Not a published paper'} · ${page+1}</div></article></div><div class="selectionbar"><span class="sub">${selection?'已选择一个段落，可保存为证据。':'点击段落，或选中段落中的部分文字后，建立卡片。'}</span><button class="small primary create-evidence" onclick="newEvidence()" ${selection?'':'disabled'}>摘录为卡片 ↗</button></div></section><section class="panel"><div class="panel-head"><h2 style="font-size:15px">证据收集箱 <span class="muted" style="font-size:11px;font-weight:400">${state.cards.length}</span></h2><button class="small ghost" onclick="navigate('review')">检查 →</button></div><div class="cards-toolbar"><input aria-label="搜索证据" placeholder="搜索卡片、释义或来源…" value="${esc(search)}" oninput="setSearch(this.value)"><select aria-label="筛选核对状态" onchange="filter=this.value;render()"><option value="all" ${filter==='all'?'selected':''}>全部状态</option><option value="pending" ${filter==='pending'?'selected':''}>待核对</option><option value="verified" ${filter==='verified'?'selected':''}>已核对</option></select></div><div class="evidence-list" id="evidenceList">${cards.map(renderCard).join('')||'<div class="empty">没有匹配的证据。试试清空搜索或更换状态。</div>'}</div></section></div><p class="footer-note">绿色背景表示该段已有摘录。核对状态表示个人检查进度，不代表论文质量认证。</p>`}
function renderCard(c){const p=paper(c.paper);return `<article class="ecard ${focusCard===c.id?'focused':''}" id="card-${c.id}"><div class="ecard-head"><span><span class="eid">${esc(c.id)}</span> <span class="badge">${esc(c.type)}</span></span>${statusBadge(c)}</div><blockquote>${esc(c.quote)}</blockquote><div class="interpretation"><span class="label">我的理解</span>${esc(c.interpretation)}</div><button class="text-link source" onclick="jumpSource('${c.id}')">↗ ${esc(p?.author||c.paper)} · 文稿第 ${c.page+1} 页</button><div class="actions"><button class="small" onclick="editEvidence('${c.id}')">编辑 / 核对</button><button class="small" onclick="linkEvidence('${c.id}')">连接论点</button><button class="small ghost" onclick="simulateAI('${c.id}')">✧ AI 检查 · 模拟</button></div></article>`}
function setSearch(s){search=s;const list=document.getElementById('evidenceList');const cs=state.cards.filter(c=>(filter==='all'||(filter==='verified'?c.verified:!c.verified))&&[c.quote,c.interpretation,c.id,paper(c.paper)?.short].join(' ').toLowerCase().includes(s.toLowerCase()));list.innerHTML=cs.map(renderCard).join('')||'<div class="empty">没有匹配的证据。</div>'}
function selectParagraph(id){const p=paper(paperId).pages[page].paragraphs.find(x=>x.id===id);selection=p;document.querySelectorAll('.paragraph').forEach(e=>e.classList.toggle('selected',e.dataset.paragraph===id));const b=document.querySelector('.selectionbar .sub');if(b)b.textContent='已选择一个段落，可保存为证据。';document.querySelectorAll('.create-evidence').forEach(b=>b.disabled=false)}

function newEvidence(){if(view!=='reader'){navigate('reader');toast('先选择文稿中的一个段落。');return}let selected=window.getSelection();let quote='';let para=selection;if(selected&&!selected.isCollapsed){const node=selected.anchorNode?.parentElement?.closest('[data-paragraph]');const end=selected.focusNode?.parentElement?.closest('[data-paragraph]');if(node&&end===node){para=paper(paperId).pages[page].paragraphs.find(p=>p.id===node.dataset.paragraph);quote=selected.toString().trim();}}if(!para){toast('请先点击原文段落，再建立证据卡片。');return}selection=para;quote=quote||para.text;window.draftQuote=quote;modal('建立证据卡片',`<span class="label">原文摘录 · ${esc(paper(paperId).author)} · 第 ${page+1} 页</span><div class="quote-box">${esc(quote)}</div><label for="draft-type">内容类型</label><select id="draft-type">${['研究结果','背景概念','作者解释','研究局限'].map(t=>`<option>${t}</option>`).join('')}</select><label for="draft-interpretation">用自己的话解释这段内容 *</label><textarea id="draft-interpretation" placeholder="这段原文说明了什么？它适用于哪些人和情境？"></textarea><label for="draft-note">局限或待确认问题</label><textarea id="draft-note" placeholder="可稍后补充" style="min-height:60px"></textarea><p class="sub">新卡片默认标记为“待核对”，之后可以对照上下文确认。</p>`,`<button onclick="closeModal()">取消</button><button class="primary" onclick="saveNewEvidence()">保存为待核对</button>`)}

function editEvidence(id){const c=card(id);modal('编辑与核对 · '+esc(id),`<div class="quote-box">${esc(c.quote)}</div><div class="field-row"><div><label for="edit-type">内容类型</label><select id="edit-type">${['研究结果','背景概念','作者解释','研究局限'].map(t=>`<option ${t===c.type?'selected':''}>${t}</option>`).join('')}</select></div><div><label>出处</label><p class="sub">${esc(paper(c.paper).author)} · 第 ${c.page+1} 页</p></div></div><div id="inline-context" hidden></div><label for="edit-interpretation">我的理解 *</label><textarea id="edit-interpretation">${esc(c.interpretation)}</textarea><label for="edit-note">局限与核对备注</label><textarea id="edit-note">${esc(c.note)}</textarea><div class="notice">核对提示：原文测量的是什么？我的解释有没有扩大样本或情境范围？研究结果与作者推测是否分开？</div><label class="check" style="display:flex;font-weight:400"><input id="edit-verified" type="checkbox" style="width:auto" ${c.verified?'checked':''}> 我已对照原文与上下文完成个人核对</label>`,`<button class="danger" onclick="deleteEvidence('${id}')">删除</button><button onclick="toggleContext('${id}')">展开上下文（保留输入）</button><button class="primary" onclick="saveEdit('${id}')">保存修改</button>`)}
function saveEdit(id){let t=document.getElementById('edit-interpretation').value.trim();if(!t){toast('释义不能为空。');return}const c=card(id);const changed=t!==c.interpretation||document.getElementById('edit-type').value!==c.type;c.interpretation=t;c.type=document.getElementById('edit-type').value;c.note=document.getElementById('edit-note').value.trim();c.verified=document.getElementById('edit-verified').checked;if(changed)state.links.filter(l=>l.card===id).forEach(l=>l.confirmed=false);persist();closeModal();render();toast(changed?'已保存。相关论点关系已重新标记为待确认。':'核对状态已保存。')}
function deleteEvidence(id){const c=structuredClone(card(id));const links=structuredClone(state.links.filter(l=>l.card===id));modal('删除证据 '+esc(id)+'？',`<p>这将同时移除 ${links.length} 条相关论点连接，保留原始文稿。</p><p class="sub">删除后可通过通知中的撤销按钮恢复。</p>`,`<button onclick="closeModal()">取消</button><button class="primary" onclick="confirmDelete('${id}')">确认删除</button>`);window.deleteBackup={c,links}}
function confirmDelete(id){state.cards=state.cards.filter(c=>c.id!==id);state.links=state.links.filter(l=>l.card!==id);persist();closeModal();render();toast('证据已删除。');const t=document.getElementById('toast');const b=document.createElement('button');b.className='small';b.textContent='撤销';b.style.marginLeft='12px';b.onclick=()=>{const a=window.deleteBackup;if(a&&!card(a.c.id)){state.cards.push(a.c);state.links.push(...a.links);persist();render();toast('已恢复证据与连接。')}};t.appendChild(b);clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),10000)}
function linkEvidence(id,existingId){const l=state.links.find(x=>x.id===existingId);modal('连接证据与论点',`<div class="quote-box">${esc(card(id).interpretation)}</div><label for="link-claim">选择论点</label><select id="link-claim">${state.claims.map(c=>`<option value="${c.id}" ${l?.claim===c.id?'selected':''}>${esc(c.id+' · '+c.text)}</option>`).join('')}</select><label for="link-type">这条证据与该论点的关系</label><select id="link-type">${Object.entries(relationNames).map(([k,v])=>`<option value="${k}" ${(l?.type||'uncertain')===k?'selected':''}>${v}</option>`).join('')}</select><label for="link-reason">为什么建立这个关系？ *</label><textarea id="link-reason" placeholder="解释适用范围，避免只写“相关”">${esc(l?.reason||'')}</textarea><label class="check" style="display:flex;font-weight:400"><input id="link-confirm" type="checkbox" style="width:auto" ${l?.confirmed?'checked':''}> 我已对照原文，确认这个关系及其理由</label><p class="sub">同一证据面对不同论点时，可以有不同关系。未勾选时保留为待确认。</p>`,`<button onclick="closeModal()">取消</button><button class="primary" onclick="saveLink('${id}','${existingId||''}')">保存连接</button>`)}
function saveLink(id,existingId){const reason=document.getElementById('link-reason').value.trim();if(!reason){toast('请补充连接理由。');return}const claimId=document.getElementById('link-claim').value;const type=document.getElementById('link-type').value;const confirmed=document.getElementById('link-confirm').checked;let l=state.links.find(x=>x.id===existingId)||state.links.find(x=>x.card===id&&x.claim===claimId);if(l)Object.assign(l,{claim:claimId,type,reason,confirmed});else state.links.push({id:uid('L',state.links),card:id,claim:claimId,type,reason,confirmed});activeClaim=claimId;mapFocus=id;nextAction={kind:'link',id,claim:claimId};persist();closeModal();render();toast('关系已保存，可直接查看对应论点地图。')}
function simulateAI(id){const c=card(id);const broad=/所有|一定|必然|完全相同/.test(c.interpretation);const message=broad?'你的释义使用了绝对或广泛表述。请核对原文是否支持该范围，并补充样本与任务限制。':'请分别核对研究对象、使用情境与测量指标；保留原文中的不确定表达。';modal('AI 释义检查 · 模拟演示',`<span class="badge pending">预设交互 · 未调用模型</span><label>原文</label><div class="quote-box">${esc(c.quote)}</div><label>你的释义</label><p>${esc(c.interpretation)}</p><div class="ai-box"><b>示例核对提示</b><p style="margin:8px 0">${message}</p><p class="sub">此处使用简单规则与固定提示，只展示未来 AI 结果的呈现方式，不能用于真实判断。</p></div>`,`<button onclick="closeModal()">忽略提示</button><button class="primary" onclick="closeModal();editEvidence('${id}')">回到原文自行修改</button>`)}
function renderCompare(){const ps=state.papers.filter(p=>compareIds.includes(p.id));const fields=[['sample','研究对象'],['context','使用情境'],['method','研究方法'],['measure','测量指标'],['finding','主要发现'],['limit','适用限制']];return heading('COMPARE · CONTEXTUALIZE','看见差异，再解释分歧','情境和方法差异是比较线索，不能直接证明结果分歧的原因。')+`<section class="panel"><div class="panel-head"><h2>选择 2–3 项研究</h2><span class="badge">演示字段均已预置</span></div><div class="compare-controls">${state.papers.map(p=>`<label class="check"><input type="checkbox" ${compareIds.includes(p.id)?'checked':''} onchange="toggleCompare('${p.id}',this.checked)">${esc(p.id+' · '+p.short)}</label>`).join('')}</div>${ps.length>=2?`<div class="table-scroll"><table><thead><tr><th>比较维度</th>${ps.map(p=>`<th>${esc(p.short)}<div class="sub">${esc(p.author)}</div></th>`).join('')}</tr></thead><tbody>${fields.map(([key,label])=>{const diff=new Set(ps.map(p=>p[key])).size>1;return `<tr><td>${label}${diff?'<div class="sub" style="font-size:9px">存在差异</div>':''}</td>${ps.map(p=>`<td class="${diff?'difference':''}">${esc(p[key]||'未填写')}<br><button class="text-link source" onclick="compareSource('${p.id}','${key}')">查看演示依据 ↗</button></td>`).join('')}</tr>`}).join('')}</tbody></table></div>`:'<div class="empty">请选择至少两项研究开始比较。</div>'}</section><div class="notice">浅黄色表示字段不同，不是证据质量或统计显著性评分。未观察到明确差异，也不等于证明两个条件完全相同。</div><section class="panel"><div class="panel-head"><h2>我的比较笔记</h2><button class="small" onclick="saveReflection()">保存笔记</button></div><div class="detail-body"><textarea id="reflection" oninput="autoSaveReflection(this.value)" placeholder="这些研究在什么条件下可以比较？哪些解释仍需进一步证据？">${esc(state.reflection)}</textarea><p class="sub"><span id="reflection-status">笔记输入后自动保存在当前浏览器。</span> 建议区分观察到的差异与可能解释。</p></div></section>`}
function toggleCompare(id,checked){if(checked){if(compareIds.length>=3){toast('一次最多比较三项研究。');render();return}compareIds.push(id)}else compareIds=compareIds.filter(x=>x!==id);render()}
function compareSource(id,key){paperId=id;page=key==='finding'?Math.min(1,paper(id).pages.length-1):key==='limit'?paper(id).pages.length-1:0;selection=null;view='reader';render();toast('已打开相关演示页面；正式版每个字段将绑定其精确原文位置。')}

function renderMap(){if(!claim(activeClaim))activeClaim=state.claims[0]?.id;const cl=claim(activeClaim);let links=state.links.filter(l=>l.claim===activeClaim&&(relFilter==='all'||l.type===relFilter));const fc=card(links.find(l=>l.card===mapFocus)?.card)||card(links[0]?.card);return heading('CONNECT · QUESTION · REVISE','让每个论点，都能回到证据','连接不是结论。写下理由，保留质疑，也允许暂时不确定。',`<button class="primary" onclick="editClaim()">＋ 新建论点</button>`)+`<div class="claim-tabs">${state.claims.map(c=>`<button class="claim-label ${c.id===activeClaim?'active':''}" title="${esc(c.text)}" onclick="activeClaim='${c.id}';mapFocus=null;render()"><span class="label">${esc(c.id)}</span>${esc(c.text)}</button>`).join('')}<button class="ghost" onclick="editClaim('${activeClaim}')">编辑当前论点</button></div><div class="map-layout"><section class="panel"><div class="map-top"><select aria-label="筛选关系类型" onchange="relFilter=this.value;render()"><option value="all">全部关系</option>${Object.entries(relationNames).map(([k,v])=>`<option value="${k}" ${relFilter===k?'selected':''}>${v}</option>`).join('')}</select><div><button class="small ${mapMode==='graph'?'primary':''}" onclick="mapMode='graph';render()">关系图</button> <button class="small ${mapMode==='list'?'primary':''}" onclick="mapMode='list';render()">列表</button></div></div>${mapMode==='graph'?renderGraph(cl,links):`<div class="detail-body"><h2>${esc(cl?.text||'先建立论点')}</h2><div class="relation-list">${links.map(l=>`<div class="relation-row"><div><span class="badge ${l.type==='challenge'?'oppose':''}">${relationNames[l.type]}</span> <b>${esc(l.card)}</b><p>${esc(card(l.card)?.interpretation)}</p><p class="sub">理由：${esc(l.reason)}</p></div><button class="small" onclick="linkEvidence('${l.card}','${l.id}')">修改</button></div>`).join('')||'<p class="sub">尚无连接。到阅读界面为证据连接论点。</p>'}</div></div>`}<div class="panel-head" style="border-top:1px solid var(--line);border-bottom:0"><div class="legend"><span style="color:var(--green)">— 支持</span><span style="color:var(--rose)">- - 质疑</span><span>··· 背景 / 待判断</span></div><span class="sub" style="font-size:10px">点击证据查看理由</span></div></section><section class="panel"><div class="panel-head"><h2 style="font-size:15px">${fc?'证据详情 · '+fc.id:'连接说明'}</h2>${fc?statusBadge(fc):''}</div><div class="detail-body">${fc?`<span class="label">原文</span><blockquote>${esc(fc.quote)}</blockquote><span class="label">我的理解</span><p>${esc(fc.interpretation)}</p>${state.links.filter(l=>l.card===fc.id&&l.claim===activeClaim).map(l=>`<div class="notice" style="margin:12px 0"><b>${relationNames[l.type]} · ${l.confirmed?'关系已确认':'关系待确认'}</b><p style="margin:6px 0 0">${esc(l.reason)}</p></div><button class="small" onclick="linkEvidence('${fc.id}','${l.id}')">修改关系与理由</button>`).join('')}<div class="gap"></div><button class="small" onclick="jumpSource('${fc.id}')">回到原文 ↗</button>`:'<p class="sub">在阅读界面点击“连接论点”，建立第一条关系。</p><button onclick="navigate(\'reader\')">去阅读</button>'}</div></section></div><p class="footer-note">当前按单个论点展示关联证据，避免全局图过载。支持与质疑的数量不能代表论点真假。</p>`}
function renderGraph(cl,links){const limited=links.slice(0,6);let nodes='';let lines='';limited.forEach((l,i)=>{const left=i%2===0,row=Math.floor(i/2),nrow=Math.ceil(limited.length/2);const y=nrow===1?39:6+row*(74/Math.max(1,nrow-1));const x=left?3:68;const centerY=y+9;const color=l.type==='support'?'#6f9271':l.type==='challenge'?'#b7776c':'#9b9e8b';lines+=`<path d="M ${left?32:68} ${centerY} C ${left?39:61} ${centerY}, ${left?35:65} 48, ${left?35:65} 48" stroke="${color}" stroke-width=".35" fill="none" ${l.type!=='support'?'stroke-dasharray="1.3 1"':''}/>`;nodes+=`<button class="map-node" style="left:${x}%;top:${y}%;border-left:3px solid ${color}" onclick="mapFocus='${l.card}';render()"><span class="node-rel">${esc(l.card)} · ${relationNames[l.type]} · ${l.confirmed?'已确认':'待确认'}</span>${esc(card(l.card)?.interpretation)}</button>`});return `<div class="map-canvas"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${lines}</svg><div class="map-node claim"><span class="label">${esc(cl?.id)} · 当前论点</span>${esc(cl?.text||'暂无论点')}</div>${nodes}${!links.length?'<div class="sub" style="position:absolute;bottom:30px;left:10%;width:80%;text-align:center">该论点尚无匹配的证据连接。</div>':''}</div>${links.length>6?'<div class="notice">图形仅展示前六条连接，请切换列表查看全部。</div>':''}`}
function editClaim(id){const c=claim(id);modal(c?'编辑论点 · '+c.id:'新建研究论点',`<label for="claim-text">论点内容 *</label><textarea id="claim-text" placeholder="写下一个具体、允许被证据检验的判断">${esc(c?.text||'')}</textarea><div class="notice">尽量写明对象和情境。若论点范围改变，相关证据关系需要重新确认。</div>`,`<button onclick="closeModal()">取消</button><button class="primary" onclick="saveClaim('${id||''}')">保存论点</button>`)}
function saveClaim(id){const text=document.getElementById('claim-text').value.trim();if(!text){toast('请填写论点。');return}const c=claim(id);if(c){if(c.text!==text){c.text=text;state.links.filter(l=>l.claim===id).forEach(l=>l.confirmed=false)}}else{id=uid('C',state.claims);state.claims.push({id,text})}activeClaim=id;persist();closeModal();render();toast('论点已保存；修改过的论点需要重新确认连接。')}
function renderReview(){const pending=state.cards.filter(c=>!c.verified),unconfirmed=state.links.filter(l=>!l.confirmed),unlinked=state.cards.filter(c=>!state.links.some(l=>l.card===c.id));return heading('AUDIT · REFLECT','检查依据，而不是计算可信分','这里显示工作状态与可检查问题，不对研究质量或论点真伪打分。')+`<div class="review-grid">${[[pending.length,'待核对的证据','需要回到原文确认含义'],[unconfirmed.length,'待确认的关系','需要检查连接理由与适用范围'],[unlinked.length,'未连接的卡片','可以保留，也可以连接到相关论点']].map(([n,t,s])=>`<div class="panel review-box"><div class="number">${n}</div><h3>${t}</h3><div class="sub">${s}</div></div>`).join('')}</div><div class="two-col"><section class="panel"><div class="panel-head"><h2>需要你检查的内容</h2></div>${pending.map(c=>`<div class="checklist-row"><div><span class="badge pending">证据待核对</span> <b>${c.id}</b><p>${esc(c.interpretation)}</p></div><button class="small" onclick="jumpSource('${c.id}');editEvidence('${c.id}')">核对</button></div>`).join('')}${unconfirmed.map(l=>`<div class="checklist-row"><div><span class="badge pending">关系待确认</span> <b>${esc(l.card+' → '+l.claim)}</b><p>${esc(l.reason)}</p></div><button class="small" onclick="linkEvidence('${l.card}','${l.id}')">检查</button></div>`).join('')}${!pending.length&&!unconfirmed.length?'<div class="empty">当前没有待确认项目。已核对不意味着证据一定正确。</div>':''}</section><section class="panel"><div class="panel-head"><h2>论点覆盖情况</h2></div>${state.claims.map(c=>{const ls=state.links.filter(l=>l.claim===c.id),sources=new Set(ls.map(l=>card(l.card)?.paper)).size;const n=ls.filter(l=>l.type==='challenge').length;return `<div class="checklist-row"><div><b>${esc(c.id+' · '+c.text)}</b><p>${ls.length} 条连接 · ${sources} 个不同来源 · ${n} 条质疑关系</p><p>${sources===1?'多张卡片仍可能只来自同一篇论文。':sources===0?'尚无连接，需要补充或重新考虑论点。':'来源数量仅描述覆盖情况，不等于证据强度。'}${n===0?' 未连接质疑材料，不代表不存在反证。':''}</p></div><button class="small" onclick="activeClaim='${c.id}';navigate('map')">查看</button></div>`}).join('')}</section></div><div class="notice">原型不会自动判定“证据充分”或“论点正确”。需要结合研究质量、相关性与局限进行人工判断。</div>`}
function renderGuide(){return heading('PROJECT BLUEPRINT','从概念原型，到可评估的系统','研究初学者如何在原文、证据与论点之间建立可靠的联系。')+`<div class="guide-grid"><section class="panel guide-card"><div class="eyebrow">01 · 用户与任务</div><h2>面向研究初学者</h2><p>大学生与授课型硕士生，在阅读 3–5 篇论文后整理文献依据。</p><ul><li>找回证据与原文上下文</li><li>区分结果、解释与局限</li><li>比较不同研究的情境和测量</li><li>检查证据是否支持论点范围</li></ul><p class="sub">这些需求是提案假设，需通过近期真实作业经历访谈验证。</p></section><section class="panel guide-card"><div class="eyebrow">02 · 原型边界</div><h2>本次可以实际操作</h2><ul><li>选择演示段落或部分文字、建立卡片</li><li>修改释义、核对状态与关系理由</li><li>比较预置研究字段、保存比较笔记</li><li>切换关系图与列表、修改论点</li><li>浏览器本地保存、导出 JSON 与文字导入</li></ul><p class="sub">未实现：真实 PDF 标注、模型调用、自动研究质量评价、云端账号与多人协作。</p></section><section class="panel guide-card"><div class="eyebrow">03 · 设计原则</div><h2>让判断过程可见、可控</h2><ul><li>状态可见：待核对、已核对、关系待确认</li><li>识别优于回忆：原文与释义并列、来源定位</li><li>用户控制：修改、拒绝、删除撤销</li><li>错误预防：修改释义或论点后重新确认连接</li><li>一致性：三个工作区共享证据编号与关系标签</li><li>渐进披露：按需打开核对与关系详情</li></ul></section><section class="panel guide-card"><div class="eyebrow">04 · 评估目标</div><h2>测量理解，不只问喜好</h2><ul><li>找到论点对应的原文依据</li><li>识别释义中的过度概括</li><li>指出两项研究不能直接比较的条件</li><li>根据质疑证据修正论点范围</li></ul><p class="sub">指标：正确率、解释评分、完成时间、错误及求助、访谈反馈。比较时保持材料与 AI 信息相同。</p></section></div><div class="gap"></div><section class="panel"><div class="panel-head"><h2>建议开发路线</h2></div><div class="detail-body">${[['阶段 1 · 需求验证与技术试验','访谈、走查；验证真实 PDF 选择、保存和定位标注。'],['阶段 2 · 手动工作流','实现导入、证据卡片、论点关系、持久保存。'],['阶段 3 · 比较与检查','实现可编辑且有出处的比较字段与待确认状态。'],['阶段 4 · 单一 AI 辅助','加入字段提取或释义范围检查；保留接受、修改与拒绝。'],['阶段 5 · 用户测试与交付','先试测修复，再正式测试；准备演示、手册与源码。']].map(([t,d])=>`<div class="milestone"><b>${t}</b><p>${d}</p></div>`).join('')}</div></section><p class="footer-note">这是设计与开发规划，不是可直接提交的课程报告。选题更换及 AI 使用范围按课程要求与老师确认。</p>`}

function importText(){modal('导入文字材料',`<p>原型支持 <b>.txt / .md</b>，最多 100 KB。文字只保存于当前浏览器。</p><p class="sub">真实 PDF 阅读与选区定位属于后续实现，不在本次概念原型中模拟为已完成。</p><label for="import-title">材料名称</label><input id="import-title" placeholder="例如：我的研究片段"><div class="notice">导入后，研究比较字段默认显示“未填写”。正式版将支持编辑字段并绑定原文。</div>`,'<button onclick="closeModal()">取消</button><button class="primary" onclick="chooseFile()">选择文字文件</button>')}
let importTitle='';function chooseFile(){importTitle=document.getElementById('import-title').value.trim();document.getElementById('fileInput').click()}
document.getElementById('fileInput').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(!/\.(txt|md)$/i.test(f.name)||f.size>102400){toast('请选择不超过100 KB的 .txt 或 .md 文件。');return}try{const text=await f.text();const paras=text.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);if(!paras.length){toast('该文件没有可用文字。');return}const id=uid('P',state.papers),pages=[];for(let i=0;i<paras.length;i+=3)pages.push({section:'Imported excerpt · '+(pages.length+1),paragraphs:paras.slice(i,i+3).map((text,j)=>({id:id+'p'+(i+j),text}))});state.papers.push({id,title:importTitle||f.name,short:importTitle||f.name,author:'用户导入材料',year:'待核对',imported:true,sample:'未填写',context:'未填写',method:'未填写',measure:'未填写',finding:'未填写',limit:'未填写',pages});persist();closeModal();openPaper(id);toast('文字材料已导入，可以选择段落并创建卡片。')}catch(err){toast('文件读取失败，请尝试 UTF-8 文字文件。')}});
function renderTaskGuide(){if(!['reader','compare','map','review'].includes(view))return '';return `<div class="task-guide" aria-label="主要任务流程"><span class="sub">工作路径 · 可自由往返</span>${[['reader','1 阅读与核对'],['compare','2 比较研究'],['map','3 连接与修订'],['review','4 检查依据']].map(([v,t],i)=>`${i?'<span class="arrow">→</span>':''}<button class="${view===v?'current':''}" onclick="navigate('${v}')">${t}</button>`).join('')}</div>`}
function renderNextAction(){if(!nextAction)return '';const a=nextAction;if(a.kind==='card'&&!card(a.id))return '';return `<section class="next-action" aria-label="保存后下一步"><strong>✓ ${esc(a.id)} ${a.kind==='card'?'卡片已保存':'关系已保存'}</strong><span class="sub">${a.kind==='card'?'保持原文，继续核对自己的理解。':'查看这条关系如何进入论证结构。'}</span>${a.kind==='card'?`<button class="small primary" onclick="editEvidence('${a.id}')">核对这张卡片</button><button class="small" onclick="linkEvidence('${a.id}')">连接论点</button>`:`<button class="small primary" onclick="activeClaim='${a.claim}';mapFocus='${a.id}';view='map';nextAction=null;render()">查看对应论点地图 →</button>`}<button class="small ghost" onclick="nextAction=null;render()" aria-label="关闭下一步提示">✕</button></section>`}
function toggleContext(id){const el=document.getElementById('inline-context');if(!el)return;if(!el.hidden){el.hidden=true;return}const c=card(id),p=paper(c.paper),pg=p.pages[c.page];el.className='context-snippet';el.innerHTML=`<span class="label">${esc(p.short)} · 第 ${c.page+1} 页 · ${esc(pg.section)}</span>${pg.paragraphs.map(x=>`<p class="${x.id===c.paragraph?'target':''}">${esc(x.text)}</p>`).join('')}<span class="sub">只展开当前页上下文，不关闭编辑窗口；输入保持不变。更多页面可在保存后返回文稿阅读。</span>`;el.hidden=false;}
function autoSaveReflection(text){state.reflection=text;persist();const el=document.getElementById('reflection-status');if(el)el.textContent=document.getElementById('saved').textContent.includes('失败')?'保存失败，请导出备份。':'比较笔记已自动保存。';}
function renderWalkthrough(){const steps=[['明确问题','当前任务是检查一个过度概括的论点，并建立可回溯的依据。','home'],['阅读并摘录','选择一段结果或局限，建立卡片并写自己的理解。','reader'],['核对与纠错','在编辑弹窗展开上下文，区分结果、解释和适用范围。','reader'],['比较研究条件','比较研究A与B的样本、任务和指标，记录谨慎的解释。','compare'],['连接与修订论点','找到完整论点标题，建立关系、写理由，修正绝对表述。','map'],['检查并导出','检查待确认连接，回到原文后人工确认，导出工作区。','review']];return heading('DESIGN · PROTOTYPE · WALK-THROUGH','用一个任务，检查整个设计','任务说明与设计者走查记录。当前没有招募真人参与者。')+`<section class="walk-task"><div class="eyebrow">具体任务 T1</div><h2>检查“共情型 AI 能提高所有用户的信任”</h2><p>你正在整理课程文献依据。阅读演示研究A、B，保存一段证据，比较研究条件；为 C3 添加带理由的关系，并把绝对表述改成更谨慎的论点。最后检查修改后哪些关系需要重新确认。</p><div class="sub">完成标准：至少一张新卡片；一条比较笔记；一条有理由的关系；一个修订论点；关系重新确认。材料均为虚构，仅用于检查交互。</div></section><div class="two-col"><section class="panel"><div class="panel-head"><h2>逐步体验</h2></div>${steps.map(([t,d,v],i)=>`<div class="walk-step"><span class="step-num">${i+1}</span><div><h3>${t}</h3><p>${d}</p></div><button class="small" onclick="navigate('${v}')">前往 →</button></div>`).join('')}</section><section class="panel"><div class="panel-head"><h2>v0.1 → v0.2 修改记录</h2></div><div class="detail-body">${[['I01','建卡前缺少持续的前置条件提示','未选择段落时禁用建卡按钮；页面一直显示选段说明。'],['I02','查看上下文会丢失未保存释义','改为弹窗内展开上下文，不切走也不覆盖输入。'],['I03','切换页面会丢失未保存比较笔记','输入时自动保存，并显示保存反馈。'],['I04','论点标签只有编号，需要反复点击','改为编号加完整论点文字，支持直接识别。'],['I05','保存后缺少持续的下一步入口','增加核对、连接、查看对应地图的操作提示。']].map(([id,t,d])=>`<div class="milestone"><span class="issue-pill">${id}</span><b>${t}</b><p>${d}</p></div>`).join('')}<div class="notice">以上是实际界面检查发现的问题与已做修改。可学习性影响仍属于设计者判断，需要之后让目标用户走查。</div></div></section></div>`}

render();
</script>
</body></html>
